services:
  postgres:
    image: postgres:16-alpine
    container_name: workforce-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: workforce
      POSTGRES_DB: workforce_pro
    ports:
      - "55432:5432"
    volumes:
      - workforce_pro_pgdata:/var/lib/postgresql/data

volumes:
  workforce_pro_pgdata:
